name: Prepare compatible security updates
on:
  push:
    branches:
      - security/2026-11-compatible-advisory-fixes
jobs:
  propose-patches:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install current lockfile without running package scripts
        run: npm ci --ignore-scripts --audit=false
      - name: Apply only compatible npm advisory patches to the lockfile
        run: |
          set +e
          npm audit fix --package-lock-only --omit=dev
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then exit "$rc"; fi
      - name: Verify lockfile is installable
        run: npm ci --ignore-scripts --audit=false
      - name: Publish patched lockfile to security branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          if git diff --cached --quiet; then
            echo "NO_COMPATIBLE_UPDATES"
          else
            git commit -m "security: apply compatible npm audit patch upgrades"
            git push origin HEAD:security/2026-11-compatible-advisory-fixes
          fi
      - name: Report remaining production advisories
        run: |
          npm audit --omit=dev --json > audit.json || true
          node -e 'const a=require("./audit.json"); console.log("REMAINING_PRODUCTION_ADVISORIES",JSON.stringify(a.metadata?.vulnerabilities||{})); for(const [n,v] of Object.entries(a.vulnerabilities||{})) console.log(n,v.severity,"fixAvailable="+JSON.stringify(v.fixAvailable))'
