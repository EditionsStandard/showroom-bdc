name: Update Express v4 patch
on:
  push:
    branches:
      - security/2026-11-compatible-advisory-fixes
jobs:
  patch-express:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Upgrade Express 4 patch and transitive qs
        run: |
          npm install --package-lock-only --ignore-scripts --audit=false express@4.22.3
          npm ci --ignore-scripts --audit=false
      - name: Report package versions
        run: |
          node -e 'for(const name of ["express","body-parser","qs","proxy-addr"]) console.log(name,require(name+"/package.json").version)'
      - name: Commit only lockfile and manifest changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "security: upgrade Express 4.22.3 and its qs parser"
            git push origin HEAD:security/2026-11-compatible-advisory-fixes
          fi
